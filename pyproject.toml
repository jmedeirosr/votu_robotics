[project]
name = "votu-robotics"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "customtkinter>=5.2.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.2",
    "pandas>=3.0.3",
    "pillow>=10.1.0",
    "PyQt6>=6.7.0,<6.8.0",
    "qtawesome>=1.3.1",
    "pyserial>=3.5",
    "reportlab>=4.2",
    "ipython>=9.15.0",
]

[project.optional-dependencies]
raspberry = [
    "gpiozero>=2.0",
    "lgpio>=0.2.2.0",
]
build = [
    "nuitka>=2.7,<3",
    "ordered-set>=4.1",
    "zstandard>=0.23",
]

[tool.unittest]
start-directory = "tests"
